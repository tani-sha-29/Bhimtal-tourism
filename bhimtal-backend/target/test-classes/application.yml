spring:
  application:
    name: bhimtal-backend-test

  datasource:
    url: jdbc:h2:mem:bhimtal_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 2525
    username: test
    password: test

app:
  mail:
    notification-recipient: test-admin@bhimtaltravel.com
    sender: test-noreply@bhimtaltravel.com
  cors:
    allowed-origins: http://localhost:3000
